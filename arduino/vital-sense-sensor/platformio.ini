; PlatformIO Project Configuration File
;
; Alternative to Arduino IDE - for advanced users
; Install PlatformIO: https://platformio.org/install
;
; Usage:
;   pio run          - Build
;   pio run -t upload - Upload to board
;   pio device monitor - Serial monitor

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
monitor_speed = 9600
upload_speed = 115200

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
monitor_speed = 9600
upload_speed = 57600

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
monitor_speed = 9600
upload_speed = 115200

